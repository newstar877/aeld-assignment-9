name: assignment-test
on:
    push:
        tags-ignore:
            - '*'
        branches:
            - '*'
jobs:
    unit-test:
        container: cuaesd/aesd-autotest:24-unit-test
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - name: Checkout submodules
            run : git submodule update --init --recursive
          - name: Run unit test
            run : |
              echo "=== Current Directory ==="
              pwd
              echo "=== Directory Contents ==="
              ls -la
              echo "=== Check Shell Paths ==="
              which sh || true
              which bash || true
              echo "=== Check Script Execution ==="
              /bin/sh -c "./unit-test.sh"
    full-test:
        container: cuaesd/aesd-autotest:24-assignment7
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - name: Checkout submodules
            run : git submodule update --init --recursive
          - name: Run full test
            run : |
              echo "=== Current Directory ==="
              pwd
              echo "=== Directory Contents ==="
              ls -la
              echo "=== Check Shell Paths ==="
              which sh || true
              which bash || true
              echo "=== Check Script Execution ==="
              /bin/sh -c "./full-test.sh"
